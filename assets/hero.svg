<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Timur — Python and AI Product Builder</title>
  <desc id="desc">A dark graphite banner with a red signal line and a product-builder headline.</desc>
  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="matrix(490 260 -170 320 1150 4)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7F1D2D" stop-opacity=".52" />
      <stop offset="1" stop-color="#0D1117" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="signal" x1="60" x2="1130" y1="262" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#E53935" />
      <stop offset="1" stop-color="#E53935" stop-opacity=".08" />
    </linearGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#E6EDF3" stroke-opacity=".045" />
    </pattern>
  </defs>
  <rect width="1200" height="310" rx="22" fill="#0D1117" />
