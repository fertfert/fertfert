  <path d="M54 28V282" stroke="#E53935" stroke-width="3" />
  <text x="84" y="73" fill="#E53935" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="700" letter-spacing="3.2">INDEPENDENT BUILDER  /  PYTHON × AI</text>
  <text x="78" y="170" fill="#F0F3F6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="88" font-weight="750" letter-spacing="-4">TIMUR</text>
  <text x="84" y="211" fill="#B1BAC4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" letter-spacing=".4">Turning practical ideas into useful products.</text>
  <path d="M84 262H1128" stroke="url(#signal)" stroke-width="1.5" />
  <circle cx="1128" cy="262" r="4" fill="#E53935" />
  <text x="84" y="287" fill="#737D89" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="1.8">TELEGRAM APPS  ·  BACKENDS  ·  AUTOMATION</text>
  <g transform="translate(1008 63)">
